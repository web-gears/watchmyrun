<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="radar-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sweep-g" x1="50%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Right Side Stylized Marathon Route & Cheer Windows Illustration -->
  <g transform="translate(690, 95)">
    <!-- Map Card Container -->
    <rect x="0" y="0" width="440" height="440" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2" opacity="0.9" />
    
    <!-- Stylized Course Polyline -->
    <path d="M 65 365 C 110 340, 125 270, 180 250 C 235 230, 240 165, 300 130 C 340 105, 365 85, 385 65" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" opacity="0.28" />
    <path d="M 65 365 C 110 340, 125 270, 180 250 C 235 230, 240 165, 300 130 C 340 105, 365 85, 385 65" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- Uncertainty Span Highlight -->
    <path d="M 155 262 C 195 245, 225 205, 255 170" fill="none" stroke="#22d3ee" stroke-width="16" stroke-linecap="round" opacity="0.35" />

    <!-- Start Marker -->
    <circle cx="65" cy="365" r="9" fill="#10b981" stroke="#ffffff" stroke-width="3" />

    <!-- Runner Live Marker -->
    <circle cx="212" cy="222" r="24" fill="#0ea5e9" opacity="0.25" />
    <circle cx="212" cy="222" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="3.5" />

    <!-- Cheer Spot 1 Marker & Pill -->
    <circle cx="300" cy="130" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <rect x="150" y="54" width="250" height="54" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="168" y="77" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">NEXT CHEER SPOT • MILE 16.5</text>
    <text x="168" y="97" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Window: 11:32 – 11:41 AM</text>

    <!-- Bottom HUD Preview Pill -->
    <rect x="30" y="340" width="380" height="72" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="50" y="368" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PROJECTED FINISH</text>
    <text x="50" y="395" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">03:42:15</text>
    <text x="235" y="368" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">LIVE PACE</text>
    <text x="235" y="395" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">5:16 /km</text>
  </g>

  <!-- Left Side Brand & Value Prop -->
  <g transform="translate(72, 95)">
    <!-- App Icon -->
    <g transform="translate(0, 0)">
      <rect width="76" height="76" rx="18" fill="url(#radar-g)" />
      <circle cx="38" cy="38" r="26" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.35" />
      <circle cx="38" cy="38" r="16" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.6" />
      <path d="M 38 38 L 59 17 A 29 29 0 0 0 24 11 Z" fill="url(#sweep-g)" />
      <circle cx="38" cy="38" r="6" fill="#ffffff" />
      <circle cx="38" cy="38" r="3.5" fill="#0284c7" />
      <circle cx="52" cy="23" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.8" />
    </g>

    <!-- Brand Name -->
    <text x="96" y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.02em">
      WatchMy<tspan fill="#38bdf8">.Run</tspan>
    </text>
    <text x="96" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      PHONE-FREE MARATHON TRACKER &amp; SPECTATOR PLANNER
    </text>

    <!-- Headline -->
    <text x="0" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      Know exactly when
    </text>
    <text x="0" y="225" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      they’ll pass <tspan fill="#38bdf8">your spot.</tspan>
    </text>

    <!-- Subheadline -->
    <text x="0" y="285" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
      Live runner position, elevation-adjusted arrival windows,
    </text>
    <text x="0" y="317" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
      and on-course sighting pin recalibration — in one link.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="185" height="44" rx="22" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <text x="92" y="28" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">6 World Majors</text>

      <rect x="200" y="0" width="195" height="44" rx="22" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="297" y="28" fill="#fbbf24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Cheer Spot Windows</text>

      <rect x="410" y="0" width="175" height="44" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="497" y="28" fill="#34d399" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Any GPX / FIT Course</text>
    </g>
  </g>
</svg>
